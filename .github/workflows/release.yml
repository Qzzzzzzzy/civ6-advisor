name: Release

# 在 GitHub 上发布一个 Release（Releases → Draft a new release → Publish）后：
# 在 Windows 上打包 exe，连同源码包一起附加到这个 Release
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[overlay]" pyinstaller pytest lupa

      - name: 跑测试
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      - name: 打包 exe
        run: pyinstaller --noconfirm --windowed --onefile --name Civ6Advisor --paths src --collect-data civ6_advisor --collect-submodules civ6_advisor scripts/launcher_entry.py

      - name: 打包源码（含一键启动脚本）
        shell: pwsh
        run: |
          $tag = "${{ github.event.release.tag_name || github.ref_name }}"
          git archive --format=zip --prefix=civ6-advisor/ -o "civ6-advisor-$tag-源码.zip" HEAD
          Copy-Item dist/Civ6Advisor.exe "Civ6Advisor-$tag.exe"

      - name: 附加到 Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: |
            Civ6Advisor-${{ github.event.release.tag_name }}.exe
            civ6-advisor-${{ github.event.release.tag_name }}-源码.zip

      - name: 手动运行时只保存为构建产物
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: civ6-advisor-build
          path: |
            Civ6Advisor-*.exe
            civ6-advisor-*-源码.zip
