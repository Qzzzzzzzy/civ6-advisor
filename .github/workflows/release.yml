name: Release

# 推送 v* 标签时：在 Windows 上打包 exe，连同源码包一起发布到 GitHub Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[overlay]" pyinstaller pytest lupa

      - name: 跑测试
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      - name: 打包 exe
        run: pyinstaller --noconfirm --windowed --onefile --name Civ6Advisor --paths src --collect-data civ6_advisor --collect-submodules civ6_advisor scripts/launcher_entry.py

      - name: 打包源码（含一键启动脚本）
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          git archive --format=zip --prefix=civ6-advisor/ -o "civ6-advisor-$tag-源码.zip" HEAD
          Copy-Item dist/Civ6Advisor.exe "Civ6Advisor-$tag.exe"

      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: 文明6军师 ${{ github.ref_name }}
          body_path: docs/release-notes/${{ github.ref_name }}.md
          files: |
            Civ6Advisor-${{ github.ref_name }}.exe
            civ6-advisor-${{ github.ref_name }}-源码.zip
